---
- name: Ensure required sonarr depencerys are present.
  apt:
    name:
      - sqlite3
      - libicu-dev
    state: present

- name: Create sonarr system user.
  user:
    name: sonarr
    home: /var/lib/sonarr
    create_home: true
    system: true

- name: Ensure Sonarr data directory exists.
  ansible.builtin.file:
    path: /var/lib/sonarr
    state: directory
    owner: sonarr
    group: sonarr
    mode: 0775

- name: Ensure sonarr installation directory is present.
  ansible.builtin.file:
    path: "{{ app_repository_path }}"
    state: directory
    owner: sonarr
    group: sonarr
    mode: 0755

- name: Download Sonarr prebuild release.
  ansible.builtin.get_url:
    url: "https://github.com/Sonarr/Sonarr/releases/download/v{{ app_version }}/Sonarr.main.{{ app_version }}.linux-x64.tar.gz"
    dest: /tmp/sonarr.tar.gz
    mode: 0644
  
- name: Extract Sonarr prebuild release.
  ansible.builtin.unarchive:
    src: /tmp/sonarr.tar.gz
    dest: "{{ app_repository_path }}"
    owner: sonarr
    group: sonarr
    remote_src: true
    extra_opts:
      - --strip-components=1

- name: Copy systemd sonarr configuration template in place.
  ansible.builtin.template:
    src: "{{ systemd_template }}"
    dest: /etc/systemd/system/sonarr.service
    owner: root
    group: root
    mode: 0644
  notify: 
  - Reload systemd
  - Restart sonarr

- name: Ensure sonarr is running and enable on boot.
  ansible.builtin.systemd_service:
    name: sonarr
    state: started
    enabled: true