---
- name: Converge
  hosts: all

  vars:
    nodejs_install_npm_user: root
    nodejs_version: "22.x"
    sonarr_auth_username: "admin"
    sonarr_auth_password: "password"


  pre_tasks:
    - name: Update apt cache.
      apt: update_cache=true cache_valid_time=600

  roles:
    - role: ansible-role-sonarr
