# TRaSH media management recomended settings
# enableMediaInfo is is optinal (true by default) its used to set desired state. Correspond to the Analyse video files option.
sonarr_media_management:
  downloadPropersAndRepacks: "doNotPrefer"
  enableMediaInfo: true 